name: Bootstrap Alpaca Flows

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-alpaca-flows.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Alpaca ratio history
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: node scripts/update-alpaca-indicators.mjs --only=ratios

      - name: Regenerate metadata files
        run: |
          node scripts/generate-status.mjs
          node scripts/generate-consolidated.mjs

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Bootstrap Alpaca flow data [skip ci]"
          git push
